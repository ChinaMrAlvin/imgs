:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    const el = (id) =&gt; document.getElementById(id);
    const esc = (s) =&gt; String(s == null ? &quot;&quot; : s).replace(/[&amp;&lt;&gt;&quot;]/g, (c) =&gt; ({ &quot;&amp;&quot;: &quot;&amp;amp;&quot;, &quot;&lt;&quot;: &quot;&amp;lt;&quot;, &quot;&gt;&quot;: &quot;&amp;gt;&quot;, &#x27;&quot;&#x27;: &quot;&amp;quot;&quot; }[c]));

    function scenList() {
      const mode = el(&quot;fc-mode&quot;).value;
      return Object.keys(scenarios).filter((k) =&gt; k.startsWith(mode));
    }
    function currentScen() { return scenarios[el(&quot;fc-scenario&quot;).value]; }

    function renderList() {
      el(&quot;fc-list-body&quot;).innerHTML = waybills.map((w) =&gt; {

    function renderInfo() {
      const w = currentScen().info;
      const modeName = { fcl: &quot;海运整柜 FCL&quot;, lcl: &quot;海运拼箱 LCL&quot;, air: &quot;空运&quot; }[w.mode];
      el(&quot;fc-info&quot;).innerHTML = [
        [&quot;运单号&quot;, w.no], [&quot;业务模式&quot;, modeName], [&quot;主单/分单&quot;, w.mbl + &quot; / &quot; + w.hbl], [&quot;订单状态&quot;, w.status],
        [&quot;航线&quot;, w.route], [&quot;船名航次&quot;, w.carrier], [&quot;货主&quot;, w.cust], [&quot;柜型柜量&quot;, w.ctnr],
        [&quot;关键时间&quot;, &#x27;&lt;span class=&quot;fc-time-keys&quot;&gt;ETD &#x27; + w.etd + &quot; · ETA &quot; + w.eta + &quot; · 截关/截港/VGM 见卡片&lt;/span&gt;&quot;]
      ].map(([k, v]) =&gt; &#x27;&lt;div class=&quot;fc-info-cell&quot;&gt;&lt;div class=&quot;fc-info-label&quot;&gt;&#x27; + esc(k) + &#x27;&lt;/div&gt;&lt;div class=&quot;fc-info-val&#x27; + (k === &quot;关键时间&quot; || k === &quot;运单号&quot; ? &quot; fc-mono&quot; : &quot;&quot;) + &#x27;&quot;&gt;&#x27; + (k === &quot;关键时间&quot; ? v : esc(v)) + &quot;&lt;/div&gt;&lt;/div&gt;&quot;).join(&quot;&quot;);
    }

    function nodeCard(card) {
      const e = card.first;
      const m = CARD[e.code];
      const tagCls = e.tag === &quot;ABNORMAL&quot; ? &quot; fc-abnormal&quot; : e.tag === &quot;REVERSE&quot; ? &quot; fc-reverse&quot; : e.tag === &quot;TERMINAL&quot; ? &quot; fc-terminal&quot; : e.tag === &quot;PARTIAL&quot; ? &quot; fc-partial&quot; : &quot;&quot;;
      const stateTxt = { ABNORMAL: &quot;异常&quot;, REVERSE: &quot;回退&quot;, TERMINAL: &quot;终止&quot;, PARTIAL: &quot;部分完成&quot; }[e.tag] || &quot;完成&quot;;
      const comms = card.evts.flatMap((x) =&gt; x.comms || []);
      const fields = e.fields ? &#x27;&lt;div class=&quot;fc-node-fields&quot;&gt;&#x27; + esc(e.fields) + &quot;&lt;/div&gt;&quot; : &quot;&quot;;
      const planned = e.planned ? &#x27;&lt;div class=&quot;fc-node-time&quot;&gt;&#x27; + esc(e.planned) + &quot;&lt;/div&gt;&quot; : &quot;&quot;;
      const charge = card.evts.map((x) =&gt; x.charge).find(Boolean);
      const chargeHtml = charge ? &#x27;&lt;span class=&quot;fc-node-charge&quot;&gt;💰 &#x27; + esc(charge.name) + &quot; &quot; + esc(charge.amount) + &quot;（只读）&lt;/span&gt;&quot; : &quot;&quot;;
      const files = card.evts.flatMap((x) =&gt; x.files || []).slice(0, 2).map((f) =&gt; &#x27;&lt;span class=&quot;fc-file&quot;&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot; style=&quot;width:12px;height:12px&quot;&gt;&lt;/i&gt;&#x27; + esc(f.n) + &quot;&lt;/span&gt;&quot;).join(&quot;&quot;);
      const repeat = card.count &gt; 1 ? &#x27;&lt;span class=&quot;fc-repeat-badge&quot;&gt;×&#x27; + card.count + &quot;&lt;/span&gt;&quot; : &quot;&quot;;
      const changeBadge = card.changed ? &#x27;&lt;span class=&quot;fc-change-badge&quot;&gt;改单 ×&#x27; + card.changed + &quot;&lt;/span&gt;&quot; : &quot;&quot;;
      const evtCount = card.evts.length + (card.changed || 0);
      return &#x27;&lt;div class=&quot;fc-node&#x27; + tagCls + &#x27;&quot;&gt;&#x27; +
        &#x27;&lt;div class=&quot;fc-node-head&quot;&gt;&lt;span class=&quot;fc-node-name&quot;&gt;&#x27; + esc(m.name) + &#x27;&lt;/span&gt;&lt;code class=&quot;fc-node-code&quot;&gt;&#x27; + esc(e.code) + &quot;&lt;/code&gt;&quot; + repeat + changeBadge + &#x27;&lt;span class=&quot;fc-node-state&quot;&gt;&#x27; + stateTxt + &quot;&lt;/span&gt;&lt;/div&gt;&quot; +
        &#x27;&lt;div class=&quot;fc-node-time&quot;&gt;&#x27; + esc(e.time) + &quot;&lt;/div&gt;&quot; + planned +
        &#x27;&lt;div class=&quot;fc-node-summary&quot;&gt;&#x27; + esc(e.summary) + &quot;&lt;/div&gt;&quot; + fields +
        &#x27;&lt;div class=&quot;fc-node-actions&quot;&gt;&#x27; +
          &#x27;&lt;button type=&quot;button&quot; data-evt=&quot;&#x27; + esc(e.code) + &#x27;&quot;&gt;&lt;i data-lucide=&quot;list&quot; aria-hidden=&quot;true&quot; style=&quot;width:12px;height:12px;vertical-align:-1px&quot;&gt;&lt;/i&gt; 事件 &#x27; + evtCount + &#x27; 条 · 查看&lt;/button&gt;&#x27; +
          &#x27;&lt;button type=&quot;button&quot; class=&quot;fc-comm-btn&quot; data-comm=&quot;&#x27; + esc(e.code) + &#x27;&quot;&gt;&lt;i data-lucide=&quot;message-circle&quot; aria-hidden=&quot;true&quot; style=&quot;width:12px;height:12px;vertical-align:-1px&quot;&gt;&lt;/i&gt; 沟通 &#x27; + (comms.length ? comms.length + &quot; 条&quot; : &quot;无&quot;) + &quot; · 查看&lt;/button&gt;&quot; +
        &quot;&lt;/div&gt;&quot; +
        (comms.length ? &#x27;&lt;div class=&quot;fc-comm-row&quot;&gt;&lt;span class=&quot;fc-comm-none&quot;&gt;&#x27; + comms.length + &quot; 条沟通挂载于本节点&lt;/span&gt;&lt;/div&gt;&quot; : &#x27;&lt;div class=&quot;fc-comm-row&quot;&gt;&lt;span class=&quot;fc-comm-none&quot;&gt;无 · 本节点未挂载沟通&lt;/span&gt;&lt;/div&gt;&#x27;) +
        chargeHtml + files +
        &quot;&lt;/div&gt;&quot;;
    }

    function buildCards(events) {
      const cards = [];
      const byCode = new Map();
      events.forEach((e) =&gt; {
        if (e.tag === &quot;CHANGE&quot;) return;
        let c = byCode.get(e.code);
        if (!c) { c = { code: e.code, first: e, count: 0, evts: [] }; byCode.set(e.code, c); cards.push(c); }
        c.count += 1;
        c.evts.push(e);
      });
      events.forEach((e) =&gt; {
        if (e.tag === &quot;CHANGE&quot; &amp;&amp; e.prev.length) {
          const t = byCode.get(e.prev[0]);
          if (t) t.changed = (t.changed || 0) + 1;
        }
      });
      return { cards, byCode };
    }

    function topoMain(mainCards) {
      const idx = new Map();
      mainCards.forEach((c, i) =&gt; idx.set(c.code, i));
      const indeg = new Map();
      mainCards.forEach((c) =&gt; indeg.set(c.code, 0));
      const adj = new Map();
      mainCards.forEach((c) =&gt; adj.set(c.code, []));
      mainCards.forEach((c) =&gt; {
        (c.first.prev || []).forEach((p) =&gt; {
          if (idx.has(p) &amp;&amp; p !== c.code) {
            adj.get(p).push(c.code);
            indeg.set(c.code, indeg.get(c.code) + 1);
          }
        });
      });
      const q = mainCards.filter((c) =&gt; indeg.get(c.code) === 0).map((c) =&gt; c.code);
      const order = [];
      while (q.length) {
        const code = q.shift();
        order.push(code);
        (adj.get(code) || []).forEach((n) =&gt; {
          indeg.set(n, indeg.get(n) - 1);
          if (indeg.get(n) === 0) q.push(n);
        });
      }
      mainCards.forEach((c) =&gt; { if (!order.includes(c.code)) order.push(c.code); });
      const byCode = new Map(mainCards.map((c) =&gt; [c.code, c]));
      return order.map((code) =&gt; byCode.get(code));
    }

    function renderFlow() {
      const events = currentScen().events;
      const { cards } = buildCards(events);
      const mainCards = cards.filter((c) =&gt; c.first.tag === &quot;NORMAL&quot; || !c.first.tag);
      const branchCards = cards.filter((c) =&gt; c.first.tag &amp;&amp; c.first.tag !== &quot;NORMAL&quot;);
      const orderedMain = topoMain(mainCards);
      const chains = [];
      branchCards.forEach((c) =&gt; {
        const prev = c.first.prev[0];
        const chain = chains.find((ch) =&gt; ch.some((x) =&gt; x.code === prev));
        if (chain) chain.push(c); else chains.push([c]);
      });
      const flow = el(&quot;fc-flow&quot;);
      flow.innerHTML = &quot;&quot;;
      orderedMain.forEach((c) =&gt; {
        const row = document.createElement(&quot;div&quot;);
        row.className = &quot;fc-row&quot;;
        const chain = chains.find((ch) =&gt; ch[0].first.prev[0] === c.code);
        let html = &#x27;&lt;span class=&quot;fc-dot&quot;&gt;&lt;/span&gt;&lt;div class=&quot;fc-row-inner&quot;&gt;&#x27; + nodeCard(c);
        if (chain) {
          const tag = chain[0].first.tag;
          const branchCls = tag === &quot;REVERSE&quot; ? &quot; fc-b-reverse&quot; : tag === &quot;TERMINAL&quot; ? &quot; fc-b-terminal&quot; : tag === &quot;PARTIAL&quot; ? &quot; fc-b-partial&quot; : &quot;&quot;;
          const tip = tag === &quot;REVERSE&quot; ? &quot;逆向回退 ↓&quot; : tag === &quot;TERMINAL&quot; ? &quot;终止 ↓&quot; : tag === &quot;PARTIAL&quot; ? &quot;部分完成 ↓&quot; : &quot;异常分支 ↓&quot;;
          const cardsHtml = chain.map((x, i) =&gt; &#x27;&lt;div class=&quot;fc-branch-tip&quot;&gt;&#x27; + (i === 0 ? tip : &quot;&quot;) + &quot;&lt;/div&gt;&quot; + nodeCard(x)).join(&quot;&quot;);
          const lastCode = chain[chain.length - 1].code;
          const mergeTarget = orderedMain.find((m) =&gt; (m.first.prev || []).includes(lastCode));
          const mergeTxt = mergeTarget
            ? &#x27;&lt;div class=&quot;fc-branch-merge&quot;&gt;↳ 汇合至 &#x27; + esc(CARD[mergeTarget.code].name) + &quot;&lt;/div&gt;&quot;
            : (tag === &quot;TERMINAL&quot; ? &#x27;&lt;div class=&quot;fc-branch-merge&quot; style=&quot;color:var(--p-gray)&quot;&gt;流程终止&lt;/div&gt;&#x27; : &quot;&quot;);
          html += &#x27;&lt;div class=&quot;fc-branch&#x27; + branchCls + &#x27;&quot;&gt;&#x27; + cardsHtml + mergeTxt + &quot;&lt;/div&gt;&quot;;
        }
        html += &quot;&lt;/div&gt;&quot;;
        row.innerHTML = html;
        flow.appendChild(row);
      });
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }

    function openScenario(key) {
      el(&quot;fc-scenario&quot;).value = key;
      renderInfo(); renderFlow();
      el(&quot;fc-title&quot;).textContent = &quot;全链路画布 · &quot; + currentScen().title;
      el(&quot;fc-view-list&quot;).classList.remove(&quot;fc-on&quot;);
      el(&quot;fc-view-canvas&quot;).classList.add(&quot;fc-on&quot;);
      el(&quot;fc-list&quot;).hidden = true;
      el(&quot;fc-canvas&quot;).hidden = false;
    }

    function evtRows(code) {
      return currentScen().events.filter((e) =&gt; e.code === code || (e.tag === &quot;CHANGE&quot; &amp;&amp; e.prev[0] === code)).map((e) =&gt; {
        const isChange = e.tag === &quot;CHANGE&quot;;
        const payloadHtml = Object.keys(e.payload).length
          ? &quot;&lt;details class=\&quot;fc-payload\&quot;&gt;&lt;summary&gt;查看原始 payload&lt;/summary&gt;&lt;pre class=\&quot;fc-json\&quot;&gt;&quot; + esc(JSON.stringify(e.payload, null, 2)) + &quot;&lt;/pre&gt;&lt;/details&gt;&quot;
          : &quot;&quot;;
        const files = (e.files || []).map((f) =&gt; &#x27;&lt;span class=&quot;fc-file&quot;&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot; style=&quot;width:12px;height:12px&quot;&gt;&lt;/i&gt;&#x27; + esc(f.n) + &quot;&lt;/span&gt;&quot;).join(&quot; &quot;);
        const changeTag = isChange ? &#x27;&lt;span class=&quot;fc-change-badge&quot;&gt;改单&lt;/span&gt;&#x27; : &quot;&quot;;
        return &#x27;&lt;div class=&quot;fc-evt&#x27; + (isChange ? &quot; fc-evt-change&quot; : &quot;&quot;) + &#x27;&quot;&gt;&#x27; +
          &#x27;&lt;div class=&quot;fc-evt-head&quot;&gt;&lt;span class=&quot;fc-strong&quot;&gt;&#x27; + esc(e.time) + &quot;&lt;/span&gt;&lt;span&gt;&quot; + esc(ROLE[e.role] || e.role) + &quot;&lt;/span&gt;&lt;span&gt;&quot; + esc(SRC[e.source] || e.source) + &quot;&lt;/span&gt;&lt;code class=\&quot;fc-node-code\&quot;&gt;&quot; + esc(e.code) + &quot;&lt;/code&gt;&quot; + changeTag + &quot;&lt;/div&gt;&quot; +
          &#x27;&lt;div class=&quot;fc-evt-sum&quot;&gt;&#x27; + esc(e.summary) + &quot;&lt;/div&gt;&quot; + payloadHtml +
          (files ? &#x27;&lt;div&gt;&#x27; + files + &quot;&lt;/div&gt;&quot; : &quot;&quot;) +
          &quot;&lt;/div&gt;&quot;;
      }).join(&quot;&quot;);
    }

    function openEventModal(code) {
      el(&quot;fc-event-title&quot;).textContent = &quot;事件日志 · &quot; + CARD[code].name;
      el(&quot;fc-event-body&quot;).innerHTML = evtRows(code) || &#x27;&lt;div class=&quot;fc-sub&quot;&gt;该节点暂无事件日志&lt;/div&gt;&#x27;;
      el(&quot;fc-event-mask&quot;).classList.add(&quot;fc-show&quot;);
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }

    const COMM_TAB = { wechat: &quot;聊天&quot;, email: &quot;邮件&quot;, phone: &quot;电话&quot;, screenshot: &quot;截图&quot; };
    let currentCommCode = null;
    function openCommModal(code) {
      currentCommCode = code;
      const comms = currentScen().events.filter((e) =&gt; e.code === code).flatMap((e) =&gt; e.comms || []);
      el(&quot;fc-comm-title&quot;).textContent = &quot;沟通记录 · &quot; + CARD[code].name + (comms.length ? &quot;（&quot; + comms.length + &quot; 条）&quot; : &quot;&quot;);
      const types = [&quot;wechat&quot;, &quot;email&quot;, &quot;phone&quot;, &quot;screenshot&quot;].filter((t) =&gt; comms.some((c) =&gt; c.type === t));
      el(&quot;fc-comm-tabs&quot;).innerHTML = types.map((t) =&gt; &#x27;&lt;button type=&quot;button&quot; data-tab=&quot;&#x27; + t + &#x27;&quot; class=&quot;&#x27; + (t === types[0] ? &quot;fc-on&quot; : &quot;&quot;) + &#x27;&quot;&gt;&#x27; + COMM_TAB[t] + &quot;&lt;/button&gt;&quot;).join(&quot;&quot;) || &#x27;&lt;button type=&quot;button&quot; class=&quot;fc-on&quot;&gt;全部&lt;/button&gt;&#x27;;
      el(&quot;fc-comm-body&quot;).innerHTML = commBody(comms, types[0]);
      el(&quot;fc-comm-mask&quot;).classList.add(&quot;fc-show&quot;);
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }
    function commBody(comms, tab) {
      const list = tab ? comms.filter((c) =&gt; c.type === tab) : comms;
      if (!list.length) return &#x27;&lt;div class=&quot;fc-sub&quot;&gt;无沟通记录&lt;/div&gt;&#x27;;
      return list.map((c) =&gt; {
        const icon = { wechat: &quot;message-circle&quot;, email: &quot;mail&quot;, phone: &quot;phone&quot;, screenshot: &quot;image&quot; }[c.type] || &quot;message-circle&quot;;
        const img = c.type === &quot;screenshot&quot; ? &#x27;&lt;div class=&quot;fc-msg-img&quot;&gt;&lt;i data-lucide=&quot;image&quot; aria-hidden=&quot;true&quot; style=&quot;width:16px;height:16px&quot;&gt;&lt;/i&gt; 截图预览&lt;/div&gt;&#x27; : &quot;&quot;;
        return &#x27;&lt;div class=&quot;fc-msg&quot;&gt;&lt;div class=&quot;fc-avatar&quot;&gt;&lt;i data-lucide=&quot;&#x27; + icon + &#x27;&quot; aria-hidden=&quot;true&quot; style=&quot;width:14px;height:14px&quot;&gt;&lt;/i&gt;&lt;/div&gt;&#x27; +
          &#x27;&lt;div class=&quot;fc-msg-body&quot;&gt;&lt;div class=&quot;fc-msg-meta&quot;&gt;&#x27; + esc(c.from) + &quot; · &quot; + COMM_TAB[c.type] + &quot;&lt;/div&gt;&quot; +
          &#x27;&lt;div class=&quot;fc-msg-text&quot;&gt;&#x27; + esc(c.text) + &quot;&lt;/div&gt;&quot; + img + &quot;&lt;/div&gt;&lt;/div&gt;&quot;;
      }).join(&quot;&quot;);
    }

    function bind() {
      el(&quot;fc-list-body&quot;).addEventListener(&quot;click&quot;, (ev) =&gt; {
        const btn = ev.target.closest(&quot;[data-open]&quot;);
        if (btn) openScenario(btn.getAttribute(&quot;data-open&quot;));
      });
      el(&quot;fc-flow&quot;).addEventListener(&quot;click&quot;, (ev) =&gt; {
        const eb = ev.target.closest(&quot;[data-evt]&quot;);
        const cb = ev.target.closest(&quot;[data-comm]&quot;);
        if (eb) openEventModal(eb.getAttribute(&quot;data-evt&quot;));
        if (cb) openCommModal(cb.getAttribute(&quot;data-comm&quot;));
      });
      document.querySelectorAll(&quot;[data-close]&quot;).forEach((b) =&gt; {
        b.addEventListener(&quot;click&quot;, () =&gt; el(b.getAttribute(&quot;data-close&quot;)).classList.remove(&quot;fc-show&quot;));
      });
      document.querySelectorAll(&quot;.fc-modal-mask&quot;).forEach((m) =&gt; {
        m.addEventListener(&quot;click&quot;, (ev) =&gt; { if (ev.target === m) m.classList.remove(&quot;fc-show&quot;); });
      });
      el(&quot;fc-comm-tabs&quot;).addEventListener(&quot;click&quot;, (ev) =&gt; {
        const b = ev.target.closest(&quot;[data-tab]&quot;);
        if (!b) return;
        document.querySelectorAll(&quot;#fc-comm-tabs button&quot;).forEach((x) =&gt; x.classList.remove(&quot;fc-on&quot;));
        b.classList.add(&quot;fc-on&quot;);
        const comms = currentCommCode ? currentScen().events.filter((e) =&gt; e.code === currentCommCode).flatMap((e) =&gt; e.comms || []) : [];
        el(&quot;fc-comm-body&quot;).innerHTML = commBody(comms, b.getAttribute(&quot;data-tab&quot;));
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      });
      el(&quot;fc-view-list&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        el(&quot;fc-view-list&quot;).classList.add(&quot;fc-on&quot;);
        el(&quot;fc-view-canvas&quot;).classList.remove(&quot;fc-on&quot;);
        el(&quot;fc-canvas&quot;).hidden = true;
        el(&quot;fc-list&quot;).hidden = false;
        el(&quot;fc-title&quot;).textContent = &quot;订单全链路看板&quot;;
      });
      el(&quot;fc-view-canvas&quot;).addEventListener(&quot;click&quot;, () =&gt; openScenario(el(&quot;fc-scenario&quot;).value));
      el(&quot;fc-mode&quot;).addEventListener(&quot;change&quot;, () =&gt; {
        const opts = scenList();
        el(&quot;fc-scenario&quot;).innerHTML = opts.map((k) =&gt; &#x27;&lt;option value=&quot;&#x27; + k + &#x27;&quot;&gt;&#x27; + scenarios[k].title + &quot;&lt;/option&gt;&quot;).join(&quot;&quot;);
        openScenario(opts[0]);
      });
      el(&quot;fc-scenario&quot;).addEventListener(&quot;change&quot;, () =&gt; openScenario(el(&quot;fc-scenario&quot;).value));
      el(&quot;fc-comm-toggle&quot;).addEventListener(&quot;change&quot;, (ev) =&gt; {
        el(&quot;fullchain-design&quot;).classList.toggle(&quot;fc-comm-off&quot;, !ev.target.checked);
      });
    }

    function init() {
      const opts = scenList();
      el(&quot;fc-scenario&quot;).innerHTML = opts.map((k) =&gt; &#x27;&lt;option value=&quot;&#x27; + k + &#x27;&quot;&gt;&#x27; + scenarios[k].title + &quot;&lt;/option&gt;&quot;).join(&quot;&quot;);
      el(&quot;fc-mode&quot;).value = &quot;fcl&quot;;
      renderList();
      el(&quot;fc-comm-toggle&quot;).checked = true;
      bind();
      renderInfo();
      renderFlow();
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }
    init();
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
